name: Moodle formatting preview

on:
  pull_request:
    paths:
      - '**/*.php'
      - '.github/workflows/autofix-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'marketplace/quality-fixes'
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, intl, xml, zip
      - name: Install Moodle code style tools
        run: composer create-project -n --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
      - name: Generate PHPCBF preview
        shell: bash
        run: |
          set -o pipefail
          if [ ! -x "$GITHUB_WORKSPACE/ci/vendor/bin/phpcbf" ]; then
            echo "PHPCBF executable not available."
            exit 1
          fi
          "$GITHUB_WORKSPACE/ci/vendor/bin/phpcbf" --standard=moodle --extensions=php "$GITHUB_WORKSPACE/plugin" || true
          git -C "$GITHUB_WORKSPACE/plugin" diff --binary > "$GITHUB_WORKSPACE/moodle-autofix.patch"
          wc -l "$GITHUB_WORKSPACE/moodle-autofix.patch"
      - name: Upload formatting patch for review
        uses: actions/upload-artifact@v4
        with:
          name: moodle-autofix-preview
          path: moodle-autofix.patch
          if-no-files-found: error
          retention-days: 7
      - name: Commit formatter changes to isolated quality branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/plugin"
          if git diff --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          git commit -m "style: apply Moodle PHPCBF automatic formatting"
          git push origin HEAD:marketplace/quality-fixes
